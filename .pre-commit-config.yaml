# Install once: pip install pre-commit && pre-commit install      Run on everything: pre-commit run --all-files
repos:
  - repo: local
    hooks:
      - id: scan-secrets
        name: scan for API-key-shaped values
        entry: python scripts/scan_secrets.py
        language: system
        pass_filenames: true
        exclude: ^(third_party/|\.venv/)
      - id: ruff
        name: ruff (SDK)
        entry: ruff check --config packages/sdk/pyproject.toml
        language: system
        files: ^packages/sdk/.*\.py$
      - id: ruff-format
        name: ruff format check (SDK)
        entry: ruff format --check --config packages/sdk/pyproject.toml
        language: system
        files: ^packages/sdk/.*\.py$
