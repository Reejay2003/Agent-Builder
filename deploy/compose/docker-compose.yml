# Core local-first stack. Run from repo root:
#   docker compose -f deploy/compose/docker-compose.yml --env-file .env up -d
name: agent-builder

services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  valkey:
    image: valkey/valkey:8.0
    ports:
      - "127.0.0.1:${VALKEY_PORT:-6379}:6379"
    volumes:
      - valkeydata:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Optional dev container with all Python deps: make dev-shell   (profile `dev`, not started by `up`)
  dev:
    profiles: ["dev"]
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.dev
    env_file: ../../.env
    volumes:
      - ../..:/workspace
    working_dir: /workspace
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  valkeydata:
