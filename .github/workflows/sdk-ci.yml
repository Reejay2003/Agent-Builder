name: sdk-ci

on:
  push:
    paths:
      - "packages/sdk/**"
      - "packages/sdk-nat/**"
      - "packages/mcp-tools/**"
      - "requirements.lock"
      - ".github/workflows/sdk-ci.yml"
  pull_request:
    paths:
      - "packages/sdk/**"
      - "packages/sdk-nat/**"
      - "packages/mcp-tools/**"
      - "requirements.lock"
      - ".github/workflows/sdk-ci.yml"

permissions:
  contents: read

jobs:
  check:
    name: lint, types, tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: packages/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      # Offline tests only: no API key, no NVIDIA stack, no cost. The `nat` marker needs the full repo setup.
      - run: python -m pytest -m "not nat and not openshell"

  runners:
    # The runner package on the real NVIDIA stack (NAT + Fabric + Relay) against the SDK's fake model server: offline,
    # no key, no cost. Slower than `check` because it installs the pinned stack from requirements.lock.
    name: runners on real NAT and Fabric (offline, fake model)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q -r requirements.lock
      - run: python -m pip install -q -e "packages/sdk[dev]" -e packages/sdk-nat
      - run: python -m pytest -q -m nat
        working-directory: packages/sdk
      - run: ruff check . && python -m pytest -q -m "not openshell"
        working-directory: packages/sdk-nat

  clean-install:
    name: wheel installs in an empty environment and imports without NVIDIA packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build --wheel packages/sdk --outdir dist
      - run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/python - <<'PY'
          import sys
          import agentbuilder
          from agentbuilder.spec import AgentSpec
          spec = AgentSpec.from_dict({"name": "demo", "model": {"provider": "openai", "model": "gpt-4.1-mini"}})
          assert spec.to_yaml().startswith("spec_version: 1")
          bad = sorted(m for m in sys.modules if m.split(".")[0] in {"nat", "nemo_fabric", "nemo_relay", "langchain"})
          assert not bad, f"core SDK must not import NVIDIA or LangChain packages: {bad}"
          print("clean install ok", agentbuilder.__version__)
          PY
