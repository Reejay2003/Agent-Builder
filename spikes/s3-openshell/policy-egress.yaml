# Egress probe policy: ONLY /usr/bin/curl may reach openrouter.ai:443. Everything else must be denied.
version: 1

filesystem_policy:
  include_workdir: false
  read_only: [/usr, /lib, /etc, /opt/venv]
  read_write: [/tmp]

landlock:
  compatibility: best_effort

process:
  run_as_user: "1000"
  run_as_group: "1000"

network_policies:
  llm_openrouter:
    name: llm-openrouter
    endpoints:
      - host: openrouter.ai
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-write
    binaries:
      - path: /usr/bin/curl
