[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agentbuilder"
version = "0.1.0.dev0"
description = "Define an agent once, then validate, compile, test, evaluate and run it with safe defaults."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Agent Builder contributors" }]
keywords = ["agents", "llm", "mcp", "sdk"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.7,<3",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
dev = [
  "mcp>=1.2",
  "pytest>=8",
  "ruff>=0.6",
  "mypy>=1.10",
  "types-PyYAML",
  "jsonschema>=4.20",
]

[project.urls]
Repository = "https://github.com/Reejay2003/Agent-Builder"

[tool.hatch.build.targets.wheel]
packages = ["src/agentbuilder"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.11"
plugins = ["pydantic.mypy"]
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["nat: needs the NVIDIA stack (NAT) installed and the repo checkout; skipped otherwise"]
addopts = "-ra"
